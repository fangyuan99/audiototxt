<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AudioToTxt</title>
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <main class="container">
      <nav>
        <ul><li><strong>🎵 AudioToTxt</strong></li></ul>
        <ul>
          <li><button type="button" id="theme-toggle" class="outline secondary">🌙</button></li>
          <li>
            <form method="post" action="/logout">
              <button type="submit" class="outline secondary">退出</button>
            </form>
          </li>
        </ul>
      </nav>
      <p>全局 Gemini/Vertex、模型与 Prompt 请在 Telegram Bot 的设置中管理。</p>

      <article>
        <form id="task-form">
          <label for="source_type">
            来源类型
            <select id="source_type" name="source_type">
              <option value="audio">音频文件</option>
              <option value="douyin">抖音分享口令/短链</option>
              <option value="youtube">YouTube 链接</option>
              <option value="video_url">视频直链</option>
            </select>
          </label>

          <div class="conditional" data-for="audio">
            <label for="file">
              音频文件
              <input id="file" name="file" type="file" accept="audio/*" />
            </label>
          </div>

          <div class="conditional" data-for="douyin">
            <label for="douyin_text">抖音分享内容</label>
            <fieldset role="group">
              <input id="douyin_text" name="douyin_text" type="text" placeholder="粘贴抖音分享内容或短链" />
              <button type="button" id="paste-douyin" class="secondary">📋</button>
            </fieldset>
          </div>

          <div class="conditional" data-for="youtube">
            <label for="youtube_url">YouTube 链接</label>
            <fieldset role="group">
              <input id="youtube_url" name="youtube_url" type="url" placeholder="https://www.youtube.com/watch?v=..." />
              <button type="button" id="paste-youtube" class="secondary">📋</button>
            </fieldset>
          </div>

          <div class="conditional" data-for="video_url">
            <label for="video_url">视频/音频直链</label>
            <fieldset role="group">
              <input id="video_url" name="video_url" type="url" placeholder="https://example.com/video.mp4" />
              <button type="button" id="paste-video" class="secondary">📋</button>
            </fieldset>
          </div>

          <fieldset role="group">
            <button type="submit" id="start-btn">开始转写</button>
            <button type="button" id="stop-btn" class="secondary" disabled>取消任务</button>
          </fieldset>
        </form>
      </article>

      <article>
        <h2>状态</h2>
        <div id="status-area"><p>等待开始……</p></div>
      </article>

      <article>
        <header>
          <nav>
            <strong>转写结果</strong>
            <button type="button" id="copy-btn" class="outline secondary">复制全文</button>
          </nav>
          <a id="download-link" style="display: none" class="outline">下载文本</a>
        </header>
        <textarea id="output" readonly rows="15" placeholder="结果会在任务完成后显示"></textarea>
      </article>
    </main>
    <script src="/static/js/main.js"></script>
  </body>
</html>
