[program:att]
command                 = /home/.venv/bin/python /home/audiototxt/telegram_bot.py
directory               = /home/audiototxt
autorestart             = true
autostart               = true
startsecs               = 3
stopasgroup              = true
killasgroup              = true
stopsignal               = TERM
stopwaitsecs             = 30
stdout_logfile          = /home/audiototxt/data/telegram_bot/logs/bot.out.log
stderr_logfile          = /home/audiototxt/data/telegram_bot/logs/bot.err.log
stdout_logfile_maxbytes = 2MB
stderr_logfile_maxbytes = 2MB
user                    = root
priority                = 999
numprocs                = 1
process_name            = %(program_name)s_%(process_num)02d
environment             = PYTHONUNBUFFERED="1"
